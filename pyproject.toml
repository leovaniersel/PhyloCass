[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phylocass"
version = "0.2.0"
description = "The Cass algorithm on PhyloZoo: rooted phylogenetic networks of low level from conflicting clusters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leo van Iersel" }]
keywords = ["phylogenetics", "phylogenetic networks", "clusters", "reticulation", "level-k"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["phylozoo>=0.2.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
phylocass = "phylocass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
